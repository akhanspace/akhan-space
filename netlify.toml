# Repo-root config so Netlify works without manual "Base directory" tweaks.
# Build runs inside site/; media is copied from ../assets and ../images.

[build]
  base = "site"
  command = "cp -r ../assets ./public/assets && cp -r ../images ./public/images && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

