[build]
  # Copy media from repo root (junctions are local-only / gitignored)
  command = "cp -r ../assets ./public/assets && cp -r ../images ./public/images && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
